# V5.1 responsive panel layout example.
REFRESH_INTERVAL=2

PANEL_TITLES[0]="System Summary"
PANEL_COMMANDS[0]="printf 'API 12\nWORKER 3\n'"
PANEL_X[0]="0%"
PANEL_Y[0]="0%"
PANEL_WIDTHS[0]="50%"
PANEL_HEIGHTS[0]="50%"
PANEL_TABLE_COLUMNS[0]="SERVICE COUNT"
PANEL_TABLE_WIDTHS[0]="12"

PANEL_TITLES[1]="Recent Events"
PANEL_COMMANDS[1]="printf 'release=READY\nlast_check=2s ago\n'"
PANEL_X[1]="50%"
PANEL_Y[1]="0%"
PANEL_WIDTHS[1]="50%"
PANEL_HEIGHTS[1]="50%"

PANEL_TITLES[2]="Release Details"
PANEL_COMMANDS[2]="printf '2026.09 ops READY\n'"
PANEL_X[2]="0%"
PANEL_Y[2]="50%"
PANEL_WIDTHS[2]="100%"
# The final panel omits height and fills the available space above the footer.
PANEL_TABLE_COLUMNS[2]="VERSION OWNER STATUS"
PANEL_TABLE_LAYOUT[2]="transpose"
PANEL_TABLE_WIDTHS[2]="14 30"
